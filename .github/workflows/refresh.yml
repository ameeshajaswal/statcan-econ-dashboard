name: Refresh StatsCan Data

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests prophet matplotlib

      - name: Pull fresh data
        run: python pull_data.py

      - name: Clean data
        run: python clean_data.py

      - name: Generate forecasts
        run: python generate_forecasts.py

      - name: Generate labour market insights
        run: python generate_ai_insights.py

      - name: Generate wage insights
        run: python generate_wage_insights.py

      - name: Generate GDP insights
        run: python generate_gdp_insights.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add clean/

          git add output/ai_insights.csv
          git add output/wage_insights.csv
          git add output/gdp_insights.csv
          git add output/unemployment_actual_vs_forecast.csv
          git add output/forecast_summary.csv

          git commit -m "Refresh StatsCan data and insights" || echo "No changes to commit"

          git push origin main